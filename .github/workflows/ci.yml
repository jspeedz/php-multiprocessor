name: CI checks
on:
    workflow_dispatch:
        inputs:
            auditVendorDependencies:
                description: 'Run audit vendor dependencies'
                required: false
                default: true
                type: boolean
            linting:
                description: 'Run linting job'
                required: false
                default: true
                type: boolean
            tests:
                description: 'Run tests job'
                required: false
                default: true
                type: boolean
    pull_request:
        branches:
            - 'development'
            - 'main'
            - 'feature/**'
            - 'release/**'
            - 'hotfix/**'
permissions:
    # @see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#permissions
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        # Fail on errors, unset variables and failures inside pipes; skip shell profile files
        shell: bash --noprofile --norc -euo pipefail {0}

env:
    PHP_VERSION: '8.4'
    PHP_EXTENSIONS: 'pcntl, posix, json'
    # Unique per run, so every check job uses exactly the dependencies installed by the install job
    VENDOR_CACHE_KEY: vendor-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    install:
        name: Install dependencies
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    # No job pushes; keep GITHUB_TOKEN out of .git/config while PR code runs
                    persist-credentials: false

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    coverage: none
                    tools: composer:v2

            -   name: Get Composer cache directory
                id: composer-cache
                run: |
                    # Separate assignment, so a failing composer command fails the step
                    dir="$(composer config cache-files-dir)"
                    echo "dir=$dir" >> "$GITHUB_OUTPUT"

            -   name: Cache Composer downloads
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
                    restore-keys: composer-${{ runner.os }}-

            -   name: Install dependencies
                run: composer install --no-interaction --no-progress --prefer-dist

            -   name: Save installed dependencies
                uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        vendor
                        composer.lock
                    key: ${{ env.VENDOR_CACHE_KEY }}

    composer:
        name: Composer validate & audit
        needs: install
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    # No job pushes; keep GITHUB_TOKEN out of .git/config while PR code runs
                    persist-credentials: false

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    coverage: none
                    tools: composer:v2

            -   name: Restore installed dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        vendor
                        composer.lock
                    key: ${{ env.VENDOR_CACHE_KEY }}
                    fail-on-cache-miss: true

            -   parallel:
                    -   name: Validate composer.json
                        run: composer validate --strict --no-check-lock

                    -   name: Audit dependencies
                        if: ${{ github.event_name != 'workflow_dispatch' || inputs.auditVendorDependencies }}
                        run: composer audit --no-interaction --locked

    phpunit:
        name: PHPUnit
        needs: install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tests }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    # No job pushes; keep GITHUB_TOKEN out of .git/config while PR code runs
                    persist-credentials: false

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    coverage: pcov

            -   name: Restore installed dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        vendor
                        composer.lock
                    key: ${{ env.VENDOR_CACHE_KEY }}
                    fail-on-cache-miss: true

            -   name: Run PHPUnit with coverage
                run: >-
                    vendor/bin/phpunit
                    --coverage-clover .phpunit.results/coverage.xml
                    --coverage-text
                    --only-summary-for-coverage-text
                    --log-junit .phpunit.results/junit.xml

            -   name: Write test results and coverage to run summary
                # Also when tests fail, that's when the summary matters most
                if: ${{ !cancelled() }}
                run: |
                    mkdir -p .phpunit.results
                    {
                        php .github/scripts/junit-markdown.php .phpunit.results/junit.xml "$GITHUB_WORKSPACE"
                        echo
                        if [[ -f .phpunit.results/coverage.xml ]]; then
                            php .github/scripts/coverage-markdown.php .phpunit.results/coverage.xml "$GITHUB_WORKSPACE"
                        else
                            printf '## Code coverage\n\n🔴 No coverage report was produced.\n'
                        fi
                    } | tee .phpunit.results/summary.md >> "$GITHUB_STEP_SUMMARY"

            -   name: Upload summary for the PR comment
                if: ${{ !cancelled() && github.event_name == 'pull_request' }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: summary-phpunit
                    path: .phpunit.results/summary.md
                    if-no-files-found: ignore
                    retention-days: 1

    phpstan:
        name: PHPStan
        needs: install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.linting }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    # No job pushes; keep GITHUB_TOKEN out of .git/config while PR code runs
                    persist-credentials: false

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    coverage: none

            -   name: Restore installed dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        vendor
                        composer.lock
                    key: ${{ env.VENDOR_CACHE_KEY }}
                    fail-on-cache-miss: true

            -   name: Run PHPStan
                run: |
                    mkdir -p .phpstan.results
                    status=0
                    vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --memory-limit=256M --no-progress \
                        --error-format=json > .phpstan.results/report.json || status=$?

                    # Annotations on the PR diff, and a summary for the run page and the PR comment
                    php .github/scripts/phpstan-markdown.php .phpstan.results/report.json "$GITHUB_WORKSPACE" --annotations
                    php .github/scripts/phpstan-markdown.php .phpstan.results/report.json "$GITHUB_WORKSPACE" \
                        | tee .phpstan.results/summary.md >> "$GITHUB_STEP_SUMMARY"

                    exit "$status"

            -   name: Upload summary for the PR comment
                if: ${{ !cancelled() && github.event_name == 'pull_request' }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: summary-phpstan
                    path: .phpstan.results/summary.md
                    if-no-files-found: ignore
                    retention-days: 1

    pr-comment:
        name: PR comment
        needs:
            - phpunit
            - phpstan
        # Also report failing checks, but skip forks: their token can't write to this repository
        if: >-
            ${{ !cancelled()
            && github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            -   name: Download summaries
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    pattern: summary-*
                    path: summaries

            -   name: Create or update PR comment
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPOSITORY: ${{ github.repository }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                    PHPUNIT_RESULT: ${{ needs.phpunit.result }}
                    PHPSTAN_RESULT: ${{ needs.phpstan.result }}
                run: |
                    # Hidden marker to find this workflow's comment again on the next run
                    marker='<!-- ci-checks-summary -->'

                    status_icon() {
                        case "$1" in
                            success) echo '🟢' ;;
                            skipped) echo '⚪' ;;
                            *) echo '🔴' ;;
                        esac
                    }

                    section() {
                        local title="$1" result="$2" file="$3"
                        if [[ -s "$file" ]]; then
                            cat "$file"
                        else
                            echo "## $title"
                            echo
                            echo "$(status_icon "$result") Job result: \`$result\`, no summary available."
                        fi
                        echo
                    }

                    {
                        echo "$marker"
                        echo "# CI checks"
                        echo
                        echo "$(status_icon "$PHPUNIT_RESULT") PHPUnit: \`$PHPUNIT_RESULT\` · $(status_icon "$PHPSTAN_RESULT") PHPStan: \`$PHPSTAN_RESULT\`"
                        echo
                        section 'PHPUnit' "$PHPUNIT_RESULT" summaries/summary-phpunit/summary.md
                        section 'PHPStan' "$PHPSTAN_RESULT" summaries/summary-phpstan/summary.md
                        echo "<sub>Commit ${HEAD_SHA:0:7} · [workflow run]($RUN_URL)</sub>"
                    } > comment.md

                    ids="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
                        --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")"
                    id="${ids%%$'\n'*}"

                    if [[ -n "$id" ]]; then
                        gh api --method PATCH "repos/$REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
                        echo "Updated comment $id"
                    else
                        gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
                        echo "Created a new comment"
                    fi
